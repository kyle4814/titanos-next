# titanos-digital: the digital products sale path (Stripe Checkout -> webhook -> signed link -> private storage: KV now, R2 when enabled).
# Checkout ON in live mode; the success page verifies the session with Stripe server-side. Next steps: docs/ops/GO_LIVE_NEXT.md. A separate Worker on purpose: going live here
# cannot change how titanos-portal-api behaves (it refuses live Stripe keys by design).
name = "titanos-digital"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
DIGITAL_STRIPE_MODE = "live"          # the only Stripe key on file is live; checkout stays OFF until DIGITAL_CHECKOUT_ENABLED = "true"
DIGITAL_CHECKOUT_ENABLED = "true"     # master switch (Kyle 2026-11-28: "Just keep checkout on"): POST /digital/checkout answers 503 unless exactly "true"
SITE_ORIGIN = "https://titanos.tech"
# DIGITAL_PUBLIC_ORIGIN = "https://api.titanos.tech"   # set once the route below is live, so emailed links use the pretty origin
MAIL_REPLY_TO = "kyle@titanos.tech"
# MAIL_FROM = "TITANOS <orders@titanos.tech>"           # only with RESEND_API_KEY

# Worker SECRETS (wrangler secret put ..., never vars, never committed):
#   DIGITAL_STRIPE_SECRET_KEY   sk_test_... now, sk_live_... at go-live
#   DIGITAL_WEBHOOK_SECRET      whsec_... of the /digital/webhook endpoint
#   DIGITAL_TOKEN_SECRET        32+ random characters (openssl rand -hex 32)
#   RESEND_API_KEY              optional. Without it the Worker sends no mail and bin/digital_mailer.py (kernel, SMTP) emails the links

[[d1_databases]]
binding = "DB"
database_name = "titanos-digital"
database_id = "c2aba8c8-91ce-4bd9-b4fb-5f35fe39fcd9"
migrations_dir = "migrations"

# PRIVATE storage. R2 is not enabled on this account (error 10042), so the zips live in Workers KV at products/<slug>.zip
# (binary values, 25 MiB limit; ours are under 500 KB). KV is never public: only this Worker reads it. When R2 is enabled, add the
# [[r2_buckets]] block below and the Worker prefers it with no code change (src/storage.ts), then run upload_to_r2.mjs --backend r2.
[[kv_namespaces]]
binding = "DIGITAL_FILES"
id = "236c2c86c6d24b1fab5f064c7dc4808f"

# [[r2_buckets]]
# binding = "DIGITAL_BUCKET"
# bucket_name = "titanos-digital-products"

# Route for the pretty origin (the site's CSP connect-src already allows api.titanos.tech). Uncomment at go-live, runbook step 8.
# api.titanos.tech is served by the older titanos-api Worker; a path route on /digital/* sits in front of it for this path only.
# routes = [{ pattern = "api.titanos.tech/digital/*", zone_name = "titanos.tech" }]
