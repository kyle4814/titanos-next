# DEPLOYED 2026-11-10 to workers.dev only (titanos-portal-api.<subdomain>.workers.dev), TEST MODE (STRIPE_MODE="test", no live Stripe key). No route/custom domain: api.titanos.tech still belongs to titanos-api.
name = "titanos-portal-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
STRIPE_MODE = "test"
TITANOS_SITE_ORIGIN = "https://titanos.tech"
# TEST MODE ONLY (2026-11-10): no mail transport is bound, so login mail is parked in the D1 dev_outbox table (migration 0025)
# and read by the operator through wrangler. buildDeps refuses this with STRIPE_MODE="live". Remove when a real mailer is bound.
DEV_OUTBOX = "1"

# Booking alert (2026-11-12): two worker SECRETS, never vars, never committed:
#   wrangler secret put TELEGRAM_BOT_TOKEN     (the bot token Kyle's kernel already uses for his DM alerts)
#   wrangler secret put TELEGRAM_CHAT_ID       (Kyle's own chat id)
# Without them /api/book still stores the booking and just sends no alert. Migration 0026_bookings.sql must be applied first.

[[d1_databases]]
binding = "DB"
database_name = "titanos-portal"
database_id = "cd81007b-6de4-4f1e-bf91-9bd482eaae74"
