# NOT DEPLOYED. Deploying is an owner card (GATE2/GATE5). Both D1 ids are placeholders until the owner supplies the live ids.
# Local: `npm run dev:local` (wrangler dev --local, a Miniflare D1 under .wrangler/state, nothing leaves the machine).
name = "titanos-portal-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[vars]
STRIPE_MODE = "test"
TITANOS_SITE_ORIGIN = "https://titanos.tech"

[[d1_databases]]
binding = "DB"
database_name = "titanos"
database_id = "REPLACE_WITH_LIVE_D1_ID"
migrations_dir = "migrations"
